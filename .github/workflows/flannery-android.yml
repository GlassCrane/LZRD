name: Flannery APK

on:
  push:
    paths:
      - 'flannery-app/**'
      - '.github/workflows/flannery-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APKs
        working-directory: flannery-app
        run: ./gradlew test assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp flannery-app/app/build/outputs/apk/release/app-release.apk dist/Flannery.apk
          ls -la dist
          # Print the signing certificate. This must stay identical between
          # builds or the APK will not install over the previous one.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs dist/Flannery.apk | grep -i "SHA-256 digest"

      - uses: actions/upload-artifact@v4
        with:
          name: flannery-apk
          path: dist/Flannery.apk
          if-no-files-found: error
