name: Flannery APK

on:
  push:
    paths:
      - 'flannery-app/**'
      - '.github/workflows/flannery-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APKs
        working-directory: flannery-app
        run: ./gradlew test assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find flannery-app/app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: flannery-apk
          path: dist/*.apk
          if-no-files-found: error
